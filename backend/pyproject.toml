[project]
name = "zagent-backend"
version = "0.1.0"
description = "FastAPI control plane: orchestrator, event pipeline, ADO/gateway adapters, sandbox manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "redis>=5,<7",
    "fakeredis>=2.26",
    "psycopg[binary]>=3.2",
    "structlog>=24",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "docker>=7",
    "zagent-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
# Testing gate (mock-unit standard): >=90% coverage enforced.
# pytest-cov picks this up from coverage's own config (cov_config.fail_under).
fail_under = 90
show_missing = true
