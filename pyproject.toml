[project]
name = "zagent"
version = "0.1.0"
description = "Zagent — ADO-native autonomous engineering platform for HAMI (uv workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = [
    "backend",
    "worker",
    "packages/contracts",
    "packages/maps",
]

[tool.uv.sources]
zagent-contracts = { workspace = true }
zagent-maps = { workspace = true }
