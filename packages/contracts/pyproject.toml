[project]
name = "collegium-contracts"
version = "0.1.0"
description = "Canonical schemas shared by backend, worker, and UI: StepEvent, UserIntent, Plan, Notebook, TriggerEvent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collegium_contracts"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "RUF", "BLE"]
ignore = ["B008", "BLE001", "RUF059", "RUF001", "RUF002", "RUF003", "UP042"]
