[project]
name = "collegium-worker"
version = "0.1.0"
description = "Sandbox-side agent runner: custom LangGraph engine (replacing Claude Agent SDK), StepEvent normalizer, Redis forwarder, control listener"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- Custom LangGraph engine (replacement for claude-agent-sdk) ---
    # Pins are deliberate. Bump only with the gate green (worker/spike/matrix.py).
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-postgres==3.1.1",
    "langgraph-prebuilt==1.1.0",
    "langchain-openai>=1.4,<2",
    "langchain-mcp-adapters>=0.1,<0.2",
    "langchain-core>=1.4,<2",
    # --- Platform glue (unchanged) ---
    "websockets>=13,<16",
    "redis>=5,<7",
    "httpx>=0.27,<1",
    "collegium-contracts",
]

[project.optional-dependencies]
# Legacy CAS runtime — kept ONLY for the dual-runtime soak and as the
# fallback target if the gate forces the hand-rolled loop. Removed from
# the default install once the seam is cut.
cas = [
    # SDK PINNED — fork_session lives in _internal (private API). Bump only with
    # the fork smoke test green (worker/tests/test_fork_smoke.py).
    "claude-agent-sdk==0.2.128",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Same families as the backend gate; the worker shares the compact style.
select = ["F", "I", "UP", "B", "RUF", "BLE"]
ignore = [
    "B008",
    "BLE001",  # deliberate never-fail boundaries at event sink / control edges
    "RUF059",
    "RUF001", "RUF002", "RUF003",  # typographic punctuation in prose is deliberate
    "UP042",   # str+Enum mixins are deliberate (JSON-serializable enums)
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
]
