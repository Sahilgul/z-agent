# Ingress: TLS at the cluster edge. WebSocket upgrade headers
# are REQUIRED for the live trace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collegium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [collegium.collegiumlabs.com]
      secretName: collegium-tls
  rules:
    - host: collegium.collegiumlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collegium-backend
                port: { number: 80 }
