# Worker pool: lane containers as Kubernetes Jobs spawned by
# the backend's sandbox manager (docker → k8s swap behind the same
# LaneManager seam). Egress locked to the gateway + dev.azure.com via
# NetworkPolicy — the prompt-injection exfiltration control, in cluster terms.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collegium-worker-egress
spec:
  podSelector:
    matchLabels: { app: collegium-worker }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: collegium-backend }
      ports: [{ port: 6379 }]
    - to: # LiteLLM gateway
        - namespaceSelector: {}
          podSelector:
            matchLabels: { app: litellm }
      ports: [{ port: 4000 }]
    - ports: # dev.azure.com only, enforced at the proxy (squid) for TLS hosts
        - { port: 443 }
---
# The worker image the backend launches as a Job per lane.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collegium-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collegium-worker-launcher
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collegium-worker-launcher
subjects:
  - kind: ServiceAccount
    name: collegium-backend
roleRef:
  kind: Role
  name: collegium-worker-launcher
  apiGroup: rbac.authorization.k8s.io
