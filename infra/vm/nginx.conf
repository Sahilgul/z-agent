# Zagent VM edge: static SPA + same-origin reverse proxy for API and WS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 25m;

    # WebSocket (run monitor stream) — upgrade headers + long reads.
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Every API router prefix (mirrors apps/web/vite.config.ts).
    location ~ ^/(auth|runs|lanes|sessions|repos|modes|hydration|approvals|team|knowledge|ideas|proposals|push|me|campaigns|deliveries|stats|bench|webhooks|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Never cache the service worker or manifest.
    location = /sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback — client-side routing owns everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
