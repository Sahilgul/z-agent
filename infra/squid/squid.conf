# Package-registry egress proxy for worker lanes.
# The lane network is internal-only; this proxy is the lanes' ONLY path to
# package registries, and it allowlists domains — nothing else gets out.
# General internet, ADO, and LLM traffic never touch this proxy.

http_port 3128

acl allowed_registries dstdomain pypi.org
acl allowed_registries dstdomain files.pythonhosted.org
acl allowed_registries dstdomain registry.npmjs.org
acl allowed_registries dstdomain npmjs.com
acl allowed_registries dstdomain registry.yarnpkg.com

acl lane_net src 172.16.0.0/12
acl ssl_ports port 443
acl connect method CONNECT

http_access deny !lane_net
http_access deny connect !ssl_ports
http_access allow allowed_registries
http_access deny all

# Dependency cache — mounted volume keeps downloads across lane runs.
cache_dir ufs /var/spool/squid 512 16 256
maximum_object_size 256 MB
cache_mem 128 MB

# NOT stdio:/proc/self/fd/1 — the worker drops to cache_effective_user
# 'proxy', which cannot write the container's root-owned stdout fd and the
# master process FATALs at boot (crash loop). The cache volume IS
# proxy-writeable (squid -z initializes it).
access_log /var/spool/squid/access.log squid
coredump_dir /var/spool/squid
