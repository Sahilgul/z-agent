# LiteLLM gateway config — OpenAI-compatible facade in front of Azure AI Foundry.
# The worker calls the gateway via ChatOpenAI (langchain-openai) on the
# /chat/completions surface — never the Anthropic /v1/messages surface. Model
# routing is PURE CONFIG: Kimi now; another open model later = add a
# model_list entry, zero architecture changes.

model_list:
  # These aliases are the ONLY names the rest of the system may ask for: lane
  # virtual keys are scoped to the thread's own alias (gateway/litellm.py
  # mint_key), and the backend registry (backend/app/core/models.py) must
  # list every alias offered in the composer. Renaming an alias breaks lanes.
  - model_name: kimi-foundry
    litellm_params:
      # All three come from infra/vm/.env — nothing deployment-specific is
      # committed here. FOUNDRY_MODEL carries the provider prefix AND the
      # deployment name, e.g. openai/Kimi-K2.6.
      model: os.environ/FOUNDRY_MODEL
      api_base: os.environ/FOUNDRY_API_BASE
      api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY
      # ``thinking`` / ``reasoning_effort`` request params must FLOW: the
      # composer offers per-model reasoning control and the worker sends them
      # via extra_body. (An earlier revision dropped ``thinking`` here as
      # Anthropic-SDK defense — that would silently neuter the control.)
    model_info:
      # EXPLICIT pricing — LiteLLM's registry may not price Kimi and the
      # spend-readback data path depends on correct numbers.
      # Confirmed against Microsoft's Kimi K2.6 launch pricing:
      # $0.95 in / $4.00 out / $0.16 cached-input per 1M.
      input_cost_per_token: 0.00000095       # $0.95 / 1M input
      output_cost_per_token: 0.000004        # $4.00 / 1M output
      cache_read_input_token_cost: 0.00000016  # $0.16 / 1M cached input
      max_tokens: 8192
      mode: chat
      # K2.6 is a reasoning model, but LiteLLM's internal model registry
      # (model_prices_and_context_window.json) doesn't flag it with
      # supports_reasoning — so LiteLLM never calls fill_reasoning_content()
      # and silently strips ``reasoning_content`` from the response before it
      # reaches the worker (BerriAI/litellm#20246, #26156). Setting it here
      # tells LiteLLM to preserve and standardize ``reasoning_content`` so the
      # worker's ChatOpenAIReasoning subclass can surface it as StepKind.THINKING.
      supports_reasoning: true

  - model_name: kimi3-foundry
    litellm_params:
      model: os.environ/FOUNDRY_MODEL_K3      # e.g. openai/Kimi-K3
      api_base: os.environ/FOUNDRY_API_BASE
      api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY
    model_info:
      # NOT confirmed against the Foundry listing — seeded at the
      # Fireworks/Moonshot first-party rate ($3 in / $15 out per 1M). Fix
      # here + backend/app/core/models.py + the worker fallback together.
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      max_tokens: 8192
      mode: chat
      # K3 always thinks; reasoning_content must flow like K2.6 (see above).
      supports_reasoning: true

  # The compare-fleet routes: same Foundry resource, same /openai/v1 surface
  # and key as kimi-foundry — only the deployment name differs. The compose
  # file ships defaults for FOUNDRY_MODEL_* (an unset os.environ/ ref resolves
  # to None and crashes LiteLLM at boot, so every route's vars must exist).
  - model_name: glm-foundry
    litellm_params:
      model: os.environ/FOUNDRY_MODEL_GLM      # e.g. openai/FW-GLM-5.2
      api_base: os.environ/FOUNDRY_API_BASE
      api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY
    model_info:
      # Azure AI Foundry (Fireworks serverless) listing, 2026-08:
      # $1.54 in / $4.84 out / $0.15 cached-input per 1M.
      input_cost_per_token: 0.00000154
      output_cost_per_token: 0.00000484
      cache_read_input_token_cost: 0.00000015
      max_tokens: 8192
      mode: chat
      # Preserve reasoning_content like kimi-foundry (see above) — GLM
      # thinking models emit it and stock LiteLLM strips it.
      supports_reasoning: true

  - model_name: deepseek-pro-foundry
    litellm_params:
      model: os.environ/FOUNDRY_MODEL_DS_PRO   # e.g. openai/DeepSeek-V4-Pro
      api_base: os.environ/FOUNDRY_API_BASE
      api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY
    model_info:
      # Azure AI Foundry DeepSeek listing, 2026-08:
      # $1.74 in / $3.48 out / $0.145 cached-input per 1M.
      input_cost_per_token: 0.00000174
      output_cost_per_token: 0.00000348
      cache_read_input_token_cost: 0.000000145
      max_tokens: 8192
      mode: chat
      supports_reasoning: true

  - model_name: deepseek-flash-foundry
    litellm_params:
      model: os.environ/FOUNDRY_MODEL_DS_FLASH  # e.g. openai/DeepSeek-V4-Flash
      api_base: os.environ/FOUNDRY_API_BASE
      api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY
    model_info:
      # Azure AI Foundry DeepSeek listing, 2026-08:
      # $0.19 in / $0.51 out / $0.028 cached-input per 1M.
      input_cost_per_token: 0.00000019
      output_cost_per_token: 0.00000051
      cache_read_input_token_cost: 0.000000028
      max_tokens: 8192
      mode: chat
      # Cheap compare lane; if a Flash variant emits reasoning_content the
      # flag keeps it flowing instead of stripping it.
      supports_reasoning: true

  # Fallback route, pre-wired: Anthropic Claude hosted on Foundry, same
  # /anthropic/v1 surface. Flip worker env ANTHROPIC_MODEL alias to this when the
  # decision matrix says so — nothing else changes.
  # - model_name: claude-fallback
  #   litellm_params:
  #     model: azure_ai/claude-sonnet-4-5
  #     api_base: https://YOUR-FOUNDRY-RESOURCE.services.ai.azure.com/models
  #     api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
