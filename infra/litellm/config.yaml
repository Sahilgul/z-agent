# LiteLLM gateway config — Anthropic-compatible facade in front of Azure AI Foundry.
# Model routing is PURE CONFIG: Kimi now; Claude-on-Foundry later = add a
# model_list entry, zero architecture changes.

model_list:
  # kimi-foundry is the ONLY name the rest of the system may ask for: lane
  # virtual keys are scoped to it (gateway/litellm.py mint_key). Renaming this
  # alias breaks every lane.
  - model_name: kimi-foundry
    litellm_params:
      # All three come from infra/vm/.env — nothing deployment-specific is
      # committed here. FOUNDRY_MODEL carries the provider prefix AND the
      # deployment name, e.g. openai/Kimi-K2.6.
      model: os.environ/FOUNDRY_MODEL
      api_base: os.environ/FOUNDRY_API_BASE
      api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY
      # The Agent SDK asks for extended thinking, which LiteLLM renders as
      # reasoning_effort/thinking. The openai/ prefix makes drop_params assume
      # OpenAI accepts both, so this Foundry deployment 400s unless named here.
      additional_drop_params: ["reasoning", "reasoning_effort", "thinking"]
    model_info:
      # EXPLICIT pricing — LiteLLM's registry may not price Kimi and the
      # spend-readback data path depends on correct numbers.
      # CONFIRM against the Foundry billing page on day 1; these are placeholders.
      input_cost_per_token: 0.0000006        # $0.60 / 1M input
      output_cost_per_token: 0.0000025       # $2.50 / 1M output
      cache_read_input_token_cost: 0.00000015
      max_tokens: 8192
      mode: chat

  # Second open model route for the open-models gate (≥2 open models).
  # The matrix passes ONLY if ≥2 models pass ALL of a–g. Add a Qwen or Llama
  # variant deployment here; FOUNDRY_MODEL_2 carries the provider prefix +
  # deployment name, e.g. openai/Qwen2.5-Coder-32B.
  # NOTE: commented out until a second Foundry deployment exists — with
  # FOUNDRY_MODEL_2 unset, `model: os.environ/FOUNDRY_MODEL_2` resolves to
  # None and LiteLLM crashes on boot ("argument of type 'NoneType' is not
  # iterable" in load_config). Uncomment and fill the _2 env vars to enable.
  # - model_name: qwen-foundry
  #   litellm_params:
  #     model: os.environ/FOUNDRY_MODEL_2
  #     api_base: os.environ/FOUNDRY_API_BASE_2
  #     api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY_2
  #     additional_drop_params: ["reasoning", "reasoning_effort", "thinking"]
  #   model_info:
  #     # CONFIRM against the Foundry billing page on day 1; these are placeholders.
  #     input_cost_per_token: 0.0000004
  #     output_cost_per_token: 0.0000014
  #     cache_read_input_token_cost: 0.0000001
  #     max_tokens: 8192
  #     mode: chat

  # Fallback route, pre-wired: Anthropic Claude hosted on Foundry, same
  # /anthropic/v1 surface. Flip worker env ANTHROPIC_MODEL alias to this when the
  # decision matrix says so — nothing else changes.
  # - model_name: claude-fallback
  #   litellm_params:
  #     model: azure_ai/claude-sonnet-4-5
  #     api_base: https://YOUR-FOUNDRY-RESOURCE.services.ai.azure.com/models
  #     api_key: os.environ/AZURE_AI_FOUNDRY_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
